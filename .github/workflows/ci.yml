name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    name: Web App — Build, Lint, Typecheck, Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Monitoring_App/milking-monitor/apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Monitoring_App/milking-monitor/apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          AUTH_SECRET: test-secret-for-ci
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Unit tests
        run: npm run test:ci

      - name: Validate production Compose file
        working-directory: Monitoring_App/milking-monitor
        run: docker compose -f docker-compose.prod.yml config --quiet

  inference-checks:
    name: Inference Service — Lint, Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Monitoring_App/milking-monitor/apps/inference-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Monitoring_App/milking-monitor/apps/inference-service/requirements.txt
            Monitoring_App/milking-monitor/apps/inference-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src tests

      - name: Dependency audit
        run: python -m pip install pip-audit && pip-audit -r requirements.txt -r requirements-dev.txt --desc
        continue-on-error: true

      - name: Pytest
        run: pytest tests/ -v --tb=short

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate shared event contracts
        working-directory: Monitoring_App/milking-monitor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("packages/shared-contracts")
          required = {
              "task-event.schema.json": {"contract_version": "1.0", "event_type": "task_event"},
              "cow-process-event.schema.json": {"contract_version": "1.0"},
          }
          for filename, expected in required.items():
              schema = json.loads((root / filename).read_text(encoding="utf-8"))
              properties = schema["properties"]
              required_fields = set(schema["required"])
              for field, value in expected.items():
                  assert properties[field].get("const") == value, f"{filename}: invalid {field}"
                  assert field in required_fields, f"{filename}: {field} is not required"
              assert schema.get("additionalProperties") is False, f"{filename}: contract must be strict"
          print("Shared event contracts validated")

  integration-checks:
    name: Integration — Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [web-checks, inference-checks]
    defaults:
      run:
        working-directory: Monitoring_App/milking-monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for docker compose
        run: |
          cat > .env << 'EOF'
          POSTGRES_DB=milking_monitor
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          EOF

      - name: Create .env.local for web
        run: |
          cat > apps/web/.env.local << 'EOF'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/milking_monitor
          AUTH_SECRET=ci-test-secret
          NEXTAUTH_SECRET=ci-test-secret
          NEXTAUTH_URL=http://localhost:3000
          INFERENCE_SERVICE_TOKEN=ci-test-token
          EOF

      - name: Create .env for inference service
        run: |
          cat > apps/inference-service/.env << 'EOF'
          RTSP_STREAM_URL=rtsp://localhost:8554/stream
          WEB_APP_INGEST_URL=http://localhost:3000/api/events/ingest
          WEB_APP_INGEST_TOKEN=ci-test-token
          MODEL_WEIGHTS_PATH=yolov8n.pt
          CORS_ORIGINS=http://localhost:3000
          EOF

      - name: Start services
        run: docker compose up -d
        timeout-minutes: 5

      - name: Dump inference logs on crash
        if: always()
        run: |
          sleep 5
          echo "=== INFERENCE SERVICE LOGS ==="
          docker compose logs inference-service
          echo "=== WEB SERVICE LOGS ==="
          docker compose logs web

      - name: Check inference service health
        run: |
          for i in $(seq 1 30); do
            response=$(curl -sf http://localhost:8001/ 2>/dev/null) && break
            echo "Waiting for inference service... ($i/30)"
            sleep 5
          done
          echo "Response: $response"
          echo "$response" | grep -q '"status":"ok"'

      - name: Check web app responds
        run: |
          for i in $(seq 1 30); do
            status=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null) && break
            echo "Waiting for web app... ($i/30)"
            sleep 5
          done
          echo "Web app status: $status"
          [ "$status" = "200" ] || [ "$status" = "302" ]

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
